<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>ScamIT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 10px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #result {
      margin-top: 10px;
      font-weight: bold;
    }
    #visualResult {

    }
    img {

      width: 48px;
      height: 48px;
    }
    #threatType {
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }
    #threatDesc {
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>🔍 ScamIT</h2>aqui
  <input type="text" id="urlInput" placeholder="Insira o link para verificação " />
  <button id="checkBtn">Verificar</button>

  <div id="visualResult" style="display: none;">
    <img id="threatIcon" src="" alt="Ícone" />
    <div id="threatType"></div>
    <div id="threatDesc"></div>
  </div>

  <p id="result"></p>

  <script src="popup.js"></script>

</html>
